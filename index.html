<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>House Viewing Inspector</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; padding: 16px; max-width: 800px; margin: 0 auto; color: #111; line-height: 1.4; }
        h1 { font-size: 22px; margin: 0 0 8px 0; }
        
        .address-input { width: 100%; font-size: 16px; font-weight: bold; padding: 12px; margin-bottom: 24px; border: 1px solid #ccc; border-radius: 8px; background: #fafafa; box-sizing: border-box; }
        .address-input:focus { border-color: #007AFF; outline: none; }
        
        .grid-2 { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
        @media (min-width: 600px) { .grid-2 { flex-direction: row; } }
        .grid-2 > div { flex: 1; }
        
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; margin-top: 16px; }
        
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 16px; background: #fafafa; appearance: none;
        }
        textarea { resize: vertical; min-height: 80px; }
        
        .score-section { text-align: center; margin: 32px 0; }
        .score-value { font-size: 42px; font-weight: bold; margin-bottom: 4px; }
        .score-desc { font-size: 13px; color: #555; }
        
        .category-row { border-bottom: 1px solid #eee; padding: 20px 0; }
        .cat-top { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
        @media (min-width: 600px) { .cat-top { flex-direction: row; align-items: flex-start; justify-content: space-between; } }
        
        .cat-info { flex: 1; }
        .cat-title { font-weight: bold; font-size: 16px; }
        .cat-desc { font-size: 13px; color: #666; margin-top: 4px; }
        
        .cat-select { width: 100%; height: 44px; }
        @media (min-width: 600px) { .cat-select { width: 180px; } }
        
        .cat-extras { display: flex; flex-direction: column; gap: 12px; }
        .cat-extras textarea { min-height: 60px; background: #fff; border: 1px solid #e5e5e5; }
        .cat-extras input[type="file"] { font-size: 14px; padding: 8px 0; border: none; background: transparent; }
        
        .gallery { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
        .gallery img { width: 130px; height: 130px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; }
        
        .question-label { font-weight: 600; font-size: 15px; margin-top: 24px; display: block; margin-bottom: 8px; line-height: 1.3; }
        
        .footer-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; padding-bottom: 40px; }
        @media (min-width: 600px) { .footer-buttons { flex-direction: row; justify-content: space-between; align-items: center; } }
        
        .btn-save { background: #34C759; color: white; border: none; padding: 14px 20px; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; flex: 1; text-align: center; }
        .btn-export { background: #007AFF; color: white; border: none; padding: 14px 20px; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; flex: 1; text-align: center; }
        .btn-clear { color: #d32f2f; background: none; border: none; font-weight: bold; font-size: 16px; cursor: pointer; padding: 12px 0; text-align: center; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 20px; font-size: 15px; display: none; z-index: 1000; }

        @media print {
            body { padding: 0; background: #fff; color: #000; }
            .footer-buttons, input[type="file"], .btn-save, .btn-export, .btn-clear, .toast { display: none !important; }
            input, select { border: none; background: transparent; padding: 0; font-size: 14px; appearance: none; }
            textarea { border: none; background: transparent; padding: 0; resize: none; }
            .address-input { border: none; background: transparent; padding: 0; font-size: 18px; }
            .gallery img { width: 150px; height: 150px; border: 1px solid #999; }
        }
    </style>
</head>
<body>

    <h1>House Viewing Inspector</h1>
    <input type="text" class="address-input" id="prop-address" value="22 Tonstall Road, Epsom KT19 9DP • Viewing 12 Sep 2026 10:45">

    <div class="grid-2">
        <div>
            <label>Asking price</label>
            <input type="number" id="prop-price" value="445000">
        </div>
        <div>
            <label>Viewing date</label>
            <input type="date" id="prop-date" value="2026-09-12">
        </div>
    </div>

    <label>Overall notes</label>
    <textarea id="prop-notes" placeholder="First impression, location, seller/agent comments..."></textarea>

    <div class="score-section">
        <div class="score-value"><span id="score">0</span>/100</div>
        <div class="score-desc">Rate each item 0-5. Score is calculated automatically.</div>
    </div>

    <div id="categories-container"></div>

    <h2 style="font-size: 20px; margin-top: 48px; border-bottom: 2px solid #eee; padding-bottom: 8px;">Questions & due diligence</h2>
    <div id="questions-container"></div>

    <label>Agent answers / follow-ups</label>
    <textarea id="agent-notes" placeholder="Record answers, names, documents promised, etc."></textarea>

    <label>Photos</label>
    <input type="file" accept="image/*" multiple onchange="handlePhotos(this, 'main')">
    <div style="font-size: 13px; color: #666; margin-top: 4px;">Photos are stored locally on this device.</div>
    <div class="gallery" id="gallery-main" style="margin-top: 12px;"></div>

    <label>Decision</label>
    <select id="prop-decision">
        <option>Select...</option>
        <option>Make Offer</option>
        <option>Shortlist</option>
        <option>Reject</option>
    </select>

    <label>Offer / negotiation notes</label>
    <textarea id="offer-notes" placeholder="Target offer, evidence, conditions, timing..."></textarea>

    <div class="footer-buttons">
        <button class="btn-save" onclick="manualSave()">Save Progress</button>
        <button class="btn-export" onclick="window.print()">Export PDF Report</button>
        <button class="btn-clear" onclick="clearData()">Clear saved data</button>
    </div>

    <div id="toast" class="toast">Progress saved successfully!</div>

    <script>
        const categories = [
            { id: 'loc', title: 'Location / street', desc: 'Is the immediate area quiet, safe and acceptable for 5+ years?' },
            { id: 'roo', title: 'Roof & Exterior', desc: 'Age, visible defects, tiles, gutters, loft evidence.' },
            { id: 'win', title: 'Windows / doors', desc: 'Condition, glazing, drafts, locks, signs of damp.' },
            { id: 'dam', title: 'Damp / mould', desc: 'Walls, corners, ceilings, behind furniture, smells.' },
            { id: 'hea', title: 'Heating / boiler', desc: 'Boiler age/model, service history, heating performance.' },
            { id: 'ele', title: 'Electrics', desc: 'Consumer unit, RCDs, sockets, visible DIY or outdated wiring.' },
            { id: 'plu', title: 'Plumbing', desc: 'Pressure, leaks, taps, toilets, hot water.' },
            { id: 'str', title: 'Structure', desc: 'Cracks, movement, extensions, floors, ceilings.' },
            { id: 'ene', title: 'Energy / insulation', desc: 'EPC, loft insulation, glazing and heating efficiency.' },
            { id: 'lea', title: 'Lease / freehold', desc: 'Tenure, service charge, ground rent, restrictions.' },
            { id: 'nei', title: 'Neighbours / noise', desc: 'Party walls, traffic, trains, commercial noise.' },
            { id: 'res', title: 'Resale', desc: 'Would the property remain attractive to another buyer?' },
            { id: 'rec', title: 'Ground Floor: Reception Room (16\'11" x 11\')', desc: 'Space, natural light, flooring, sockets, fireplace/radiators.' },
            { id: 'din', title: 'Ground Floor: Dining Room (11\' x 8\'2")', desc: 'Access to garden, flow, light, wall condition.' },
            { id: 'kit', title: 'Ground Floor: Kitchen (11\'1" x 7\'5")', desc: 'Units, appliances, worktops, sink plumbing, extraction.' },
            { id: 'bed1', title: 'First Floor: Front Bedroom (14\'7" x 11\')', desc: 'Size, wardrobe space, window condition, flooring.' },
            { id: 'bed2', title: 'First Floor: Rear Bedroom (11\'5" x 10\'10")', desc: 'View, natural light, wall cracks, radiator.' },
            { id: 'bath', title: 'First Floor: Bathroom / Shower Room', desc: 'Shower pressure, sanitaryware, tiling, ventilation, sealant.' },
            { id: 'summer', title: 'Outbuilding: Summer House / Office (13\'6" x 12\'9")', desc: 'Structure, electricity, insulation, usable workspace condition.' },
            { id: 'storage', title: 'Outbuilding: Storage Area (13\'6" x 5\'9")', desc: 'Dryness, security, structural integrity, access doors.' },
            { id: 'gar', title: 'Garden & Parking', desc: 'Condition, privacy, orientation, drainage, dedicated parking space.' }
        ];

        const questions = [
            "1. Why is the seller moving and how long has it been on the market?",
            "2. Have there been previous offers? Why did any sale fall through?",
            "3. How long has the seller owned it?",
            "4. What is the exact tenure and are there any service charges/estate charges?",
            "5. Any planned major works or disputes affecting the property?",
            "6. Any extensions or alterations? Are planning/building-control documents available?",
            "7. Age and service history of boiler/heating system?",
            "8. Any history of damp, flooding, subsidence or insurance claims?",
            "9. Roof age and any recent repairs?",
            "10. Which fixtures/fittings are included?",
            "11. Council tax band and approximate annual amount?",
            "12. Typical utility costs / EPC recommendations?",
            "13. Any parking restrictions, permits or rights?",
            "14. Any neighbour disputes or boundary issues?",
            "15. How quickly does the seller want to exchange/complete?"
        ];

        const catContainer = document.getElementById('categories-container');
        categories.forEach((cat, index) => {
            catContainer.insertAdjacentHTML('beforeend', `
                <div class="category-row">
                    <div class="cat-top">
                        <div class="cat-info">
                            <div class="cat-title">${cat.title}</div>
                            <div class="cat-desc">${cat.desc}</div>
                        </div>
                        <select class="cat-select" id="score-${index}" onchange="calcScore(); saveData();">
                            <option value="0">0 - unknown/bad</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5 - excellent</option>
                        </select>
                    </div>
                    <div class="cat-extras">
                        <textarea id="note-${index}" placeholder="${cat.title} notes..." oninput="saveData()"></textarea>
                        <input type="file" accept="image/*" multiple onchange="handlePhotos(this, '${cat.id}')">
                        <div class="gallery" id="gallery-${cat.id}"></div>
                    </div>
                </div>
            `);
        });

        const qContainer = document.getElementById('questions-container');
        questions.forEach((q, index) => {
            qContainer.insertAdjacentHTML('beforeend', `
                <label class="question-label">${q}</label>
                <textarea id="q-note-${index}" placeholder="Answer / notes" oninput="saveData()"></textarea>
            `);
        });

        ['prop-address', 'prop-price', 'prop-date', 'prop-notes', 'agent-notes', 'prop-decision', 'offer-notes'].forEach(id => {
            document.getElementById(id).addEventListener('input', saveData);
            document.getElementById(id).addEventListener('change', saveData);
        });

        function calcScore() {
            let total = 0;
            const count = categories.length;
            document.querySelectorAll('.cat-select').forEach(sel => total += parseInt(sel.value));
            const maxPossible = count * 5;
            document.getElementById('score').innerText = Math.round((total / maxPossible) * 100);
        }

        function handlePhotos(input, id) {
            const gallery = document.getElementById(`gallery-${id}`);
            Array.from(input.files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        gallery.appendChild(img);
                        saveData();
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        function manualSave() {
            saveData();
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        function saveData() {
            const data = {
                address: document.getElementById('prop-address').value,
                price: document.getElementById('prop-price').value,
                date: document.getElementById('prop-date').value,
                notes: document.getElementById('prop-notes').value,
                agentNotes: document.getElementById('agent-notes').value,
                decision: document.getElementById('prop-decision').value,
                offerNotes: document.getElementById('offer-notes').value,
                scores: {},
                catNotes: {},
                qNotes: {},
                galleries: {}
            };

            categories.forEach((cat, index) => {
                data.scores[index] = document.getElementById(`score-${index}`).value;
                data.catNotes[index] = document.getElementById(`note-${index}`).value;
                data.galleries[cat.id] = document.getElementById(`gallery-${cat.id}`).innerHTML;
            });

            questions.forEach((q, index) => {
                data.qNotes[index] = document.getElementById(`q-note-${index}`).value;
            });

            data.galleries['main'] = document.getElementById('gallery-main').innerHTML;

            localStorage.setItem('inspection_data', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('inspection_data');
            if (!saved) return;
            const data = JSON.parse(saved);

            if(data.address) document.getElementById('prop-address').value = data.address;
            if(data.price) document.getElementById('prop-price').value = data.price;
            if(data.date) document.getElementById('prop-date').value = data.date;
            if(data.notes) document.getElementById('prop-notes').value = data.notes;
            if(data.agentNotes) document.getElementById('agent-notes').value = data.agentNotes;
            if(data.decision) document.getElementById('prop-decision').value = data.decision;
            if(data.offerNotes) document.getElementById('offer-notes').value = data.offerNotes;

            if(data.scores) {
                Object.keys(data.scores).forEach(i => {
                    const el = document.getElementById(`score-${i}`);
                    if(el) el.value = data.scores[i];
                });
            }

            if(data.catNotes) {
                Object.keys(data.catNotes).forEach(i => {
                    const el = document.getElementById(`note-${i}`);
                    if(el) el.value = data.catNotes[i];
                });
            }

            if(data.qNotes) {
                Object.keys(data.qNotes).forEach(i => {
                    const el = document.getElementById(`q-note-${i}`);
                    if(el) el.value = data.qNotes[i];
                });
            }

            if(data.galleries) {
                Object.keys(data.galleries).forEach(id => {
                    const g = document.getElementById(`gallery-${id}`);
                    if(g && data.galleries[id]) g.innerHTML = data.galleries[id];
                });
            }

            calcScore();
        }

        function clearData() {
            if(confirm("Are you sure you want to clear all data and photos?")) {
                localStorage.removeItem('inspection_data');
                window.location.reload();
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
