<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>House Viewing Inspector</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; padding: 16px; max-width: 800px; margin: 0 auto; color: #111; line-height: 1.4; }
        h1 { font-size: 22px; margin: 0 0 8px 0; }
        
        /* Editable Address Header */
        .address-input { width: 100%; font-size: 15px; color: #555; padding: 8px 12px; margin-bottom: 24px; border: 1px dashed #ccc; border-radius: 4px; background: #fafafa; box-sizing: border-box; }
        .address-input:focus { border-style: solid; border-color: #007AFF; outline: none; }
        
        /* Mobile-First Grid */
        .grid-2 { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
        @media (min-width: 600px) { .grid-2 { flex-direction: row; } }
        .grid-2 > div { flex: 1; }
        
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; margin-top: 16px; }
        
        /* 16px font prevents iPhone auto-zoom on focus */
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 16px; background: #fafafa; appearance: none;
        }
        textarea { resize: vertical; min-height: 80px; }
        
        .score-section { text-align: center; margin: 32px 0; }
        .score-value { font-size: 42px; font-weight: bold; margin-bottom: 4px; }
        .score-desc { font-size: 13px; color: #555; }
        
        .category-row { border-bottom: 1px solid #eee; padding: 20px 0; }
        .cat-top { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
        @media (min-width: 600px) { .cat-top { flex-direction: row; align-items: flex-start; justify-content: space-between; } }
        
        .cat-info { flex: 1; }
        .cat-title { font-weight: bold; font-size: 16px; }
        .cat-desc { font-size: 13px; color: #666; margin-top: 4px; }
        
        .cat-select { width: 100%; height: 44px; }
        @media (min-width: 600px) { .cat-select { width: 180px; } }
        
        .cat-extras { display: flex; flex-direction: column; gap: 12px; }
        .cat-extras textarea { min-height: 60px; background: #fff; border: 1px solid #e5e5e5; }
        .cat-extras input[type="file"] { font-size: 14px; padding: 8px 0; border: none; background: transparent; }
        
        .gallery { display: flex; gap: 8px; flex-wrap: wrap; }
        .gallery img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
        
        .question-label { font-weight: 600; font-size: 15px; margin-top: 24px; display: block; margin-bottom: 8px; line-height: 1.3;}
        
        .footer-buttons { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; padding-bottom: 40px; }
        .btn-export { color: #ccc; background: none; border: none; font-weight: bold; font-size: 16px; cursor: default; padding: 12px 0; }
        .btn-clear { color: #d32f2f; background: none; border: none; font-weight: bold; font-size: 16px; cursor: pointer; padding: 12px 0; }
    </style>
</head>
<body>

    <h1>House Viewing Inspector</h1>
    <input type="text" class="address-input" value="22 Tonstall Road, Epsom KT19 9DP • Viewing 12 Sep 2026 10:45">

    <div class="grid-2">
        <div>
            <label>Asking price</label>
            <input type="number" value="445000">
        </div>
        <div>
            <label>Viewing date</label>
            <input type="date" value="2026-09-12">
        </div>
    </div>

    <label>Overall notes</label>
    <textarea placeholder="First impression, location, seller/agent comments..."></textarea>

    <div class="score-section">
        <div class="score-value"><span id="score">0</span>/100</div>
        <div class="score-desc">Rate each item 0-5. Score is calculated automatically.</div>
    </div>

    <div id="categories-container"></div>

    <h2 style="font-size: 20px; margin-top: 48px; border-bottom: 2px solid #eee; padding-bottom: 8px;">Questions & due diligence</h2>
    <div id="questions-container"></div>

    <label>Agent answers / follow-ups</label>
    <textarea placeholder="Record answers, names, documents promised, etc."></textarea>

    <label>Photos</label>
    <input type="file" multiple onchange="handlePhotos(this, 'main')">
    <div style="font-size: 13px; color: #666; margin-top: 4px;">Photos are stored locally on this device. Take photos of rooms, garden, roof, meter/boiler, electrics, parking and any defects.</div>
    <div class="gallery" id="gallery-main" style="margin-top: 12px;"></div>

    <label>Decision</label>
    <select>
        <option>Select...</option>
        <option>Make Offer</option>
        <option>Shortlist</option>
        <option>Reject</option>
    </select>

    <label>Offer / negotiation notes</label>
    <textarea placeholder="Target offer, evidence, conditions, timing..."></textarea>

    <div class="footer-buttons">
        <button class="btn-export">Export inspection</button>
        <button class="btn-clear" onclick="window.location.reload()">Clear saved data</button>
    </div>

    <script>
        const categories = [
            { id: 'loc', title: 'Location / street', desc: 'Is the immediate area quiet, safe and acceptable for 5+ years?' },
            { id: 'gar', title: 'Garden', desc: 'Condition, privacy, orientation, drainage, boundaries, usable space.' },
            { id: 'par', title: 'Parking', desc: 'Dedicated/legal parking? Restrictions? Easy access?' },
            { id: 'roo', title: 'Roof', desc: 'Age, visible defects, tiles, gutters, loft evidence.' },
            { id: 'win', title: 'Windows / doors', desc: 'Condition, glazing, drafts, locks, signs of damp.' },
            { id: 'dam', title: 'Damp / mould', desc: 'Walls, corners, ceilings, behind furniture, smells.' },
            { id: 'hea', title: 'Heating / boiler', desc: 'Boiler age/model, service history, heating performance.' },
            { id: 'ele', title: 'Electrics', desc: 'Consumer unit, RCDs, sockets, visible DIY or outdated wiring.' },
            { id: 'plu', title: 'Plumbing', desc: 'Pressure, leaks, taps, toilets, hot water.' },
            { id: 'str', title: 'Structure', desc: 'Cracks, movement, extensions, floors, ceilings.' },
            { id: 'kit', title: 'Kitchen / bathroom', desc: 'Condition and likely replacement cost.' },
            { id: 'ene', title: 'Energy / insulation', desc: 'EPC, loft insulation, glazing and heating efficiency.' },
            { id: 'lea', title: 'Lease / freehold', desc: 'Tenure, service charge, ground rent, restrictions.' },
            { id: 'nei', title: 'Neighbours / noise', desc: 'Party walls, traffic, trains, commercial noise.' },
            { id: 'res', title: 'Resale', desc: 'Would the property remain attractive to another buyer?' }
        ];

        const questions = [
            "1. Why is the seller moving and how long has it been on the market?",
            "2. Have there been previous offers? Why did any sale fall through?",
            "3. How long has the seller owned it?",
            "4. What is the exact tenure and are there any service charges/estate charges?",
            "5. Any planned major works or disputes affecting the property?",
            "6. Any extensions or alterations? Are planning/building-control documents available?",
            "7. Age and service history of boiler/heating system?",
            "8. Any history of damp, flooding, subsidence or insurance claims?",
            "9. Roof age and any recent repairs?",
            "10. Which fixtures/fittings are included?",
            "11. Council tax band and approximate annual amount?",
            "12. Typical utility costs / EPC recommendations?",
            "13. Any parking restrictions, permits or rights?",
            "14. Any neighbour disputes or boundary issues?",
            "15. How quickly does the seller want to exchange/complete?"
        ];

        const catContainer = document.getElementById('categories-container');
        categories.forEach(cat => {
            catContainer.insertAdjacentHTML('beforeend', `
                <div class="category-row">
                    <div class="cat-top">
                        <div class="cat-info">
                            <div class="cat-title">${cat.title}</div>
                            <div class="cat-desc">${cat.desc}</div>
                        </div>
                        <select class="cat-select" onchange="calcScore()">
                            <option value="0">0 - unknown/bad</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5 - excellent</option>
                        </select>
                    </div>
                    <div class="cat-extras">
                        <textarea placeholder="${cat.title} notes..."></textarea>
                        <input type="file" accept="image/*" multiple onchange="handlePhotos(this, '${cat.id}')">
                        <div class="gallery" id="gallery-${cat.id}"></div>
                    </div>
                </div>
            `);
        });

        const qContainer = document.getElementById('questions-container');
        questions.forEach(q => {
            qContainer.insertAdjacentHTML('beforeend', `
                <label class="question-label">${q}</label>
                <textarea placeholder="Answer / notes"></textarea>
            `);
        });

        function calcScore() {
            let total = 0;
            document.querySelectorAll('.cat-select').forEach(sel => total += parseInt(sel.value));
            document.getElementById('score').innerText = Math.round((total / 75) * 100);
        }

        function handlePhotos(input, id) {
            const gallery = document.getElementById(`gallery-${id}`);
            Array.from(input.files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.onload = () => URL.revokeObjectURL(img.src);
                    gallery.appendChild(img);
                }
            });
        }
    </script>
</body>
</html>
